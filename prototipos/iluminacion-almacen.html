<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Prototipo de iluminación</title>
<style>
:root{--bg:#000;--fg:#e8edf2;--dim:#8a96a3;--accent:#2fd0ff;--panel:rgba(6,10,14,.78);--line:rgba(255,255,255,.14)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:600 12px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:5px;max-width:calc(100% - 16px)}
button{font:inherit;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:7px 9px;border-radius:3px;min-height:32px}
button.on{border-color:var(--accent);color:var(--accent)}
button#mode{background:#0b6f8c;border-color:var(--accent);color:#fff;min-width:118px}
button#mode.before{background:#5a3a12;border-color:#ffb547}
#stats{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line);padding:6px 8px;border-radius:3px;color:var(--dim);font:600 11px/1.3 ui-monospace,Menlo,monospace;text-align:right}
#tag{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));background:var(--panel);border:1px solid var(--line);padding:6px 9px;border-radius:3px;letter-spacing:.08em;text-transform:uppercase}
#tag b{color:var(--accent)}
body.clean #ui,body.clean #stats{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="mode">Después</button>
  <button id="quality">Calidad: media</button>
  <button data-k="shadows" class="on">Sombras</button>
  <button data-k="normals" class="on">Relieve</button>
  <button data-k="bloom" class="on">Bloom</button>
  <button data-k="grain" class="on">Grano</button>
  <button data-k="fog" class="on">Visión</button>
  <button id="pause">Pausa</button>
</div>
<div id="tag"><b>Nave · sitio A</b> · Operación Almacén</div>
<div id="stats">–</div>
<script>
'use strict';
// Prueba de concepto aislada (no toca el juego): sala del Almacén con
// luces puntuales y focos con sombras suaves 2.5D calculadas en espacio de
// mapa, materiales procedurales con relieve y rugosidad, AO de contacto,
// HDR + bloom + tonemapping fílmico + grano + viñeta, y la niebla de guerra
// resuelta con el mismo trazado de visibilidad. Cero dependencias.
// v2: las sombras se trazan sobre un campo de distancias 2D con altura (SDF)
// en vez de marchar a pasos fijos; luces fijas horneadas una vez a 32 px/m;
// luces dinámicas y visión en una sola textura RGBA a resolución por calidad;
// personajes como sombras analíticas por píxel; muestreo bicúbico; la escena
// se dibuja a resolución alta y separada de la resolución de la luz.
// Parámetros: ?t=6.4 (congela el tiempo) ?modo=antes ?calidad=baja|media|alta ?escala=2 ?limpio
const Q = new URLSearchParams(location.search);
const FREEZE = Q.has('t') ? parseFloat(Q.get('t')) : null;
if (Q.has('limpio')) document.body.classList.add('clean');
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
if (!gl) { document.body.innerHTML = '<p style="padding:20px;color:#fff">Este prototipo necesita WebGL2.</p>'; throw new Error('webgl2'); }
const HDR = !!gl.getExtension('EXT_color_buffer_float');
const OUT_SCALE = HDR ? 1 : 0.25; // sin HDR, la escena se guarda comprimida en RGBA8

// ------------------------------------------------------------ mapa y escena
const MAP = { w: 24, h: 13 };
const HPPM = 20; // heightmap y campo de distancias px/m
const SPPM = 32; // luces fijas horneadas px/m
const FPPM = 48; // suelo horneado px/m
const lin = (hex) => { const n = parseInt(hex.slice(1), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255].map((v) => Math.pow(v, 2.2)); };

const occluders = []; // {x0,y0,x1,y1,h} o {cx,cy,r,h}
const SV = []; // malla estática
function pushV(a, p, n, c, m, uv) { a.push(p[0], p[1], p[2], n[0], n[1], n[2], c[0], c[1], c[2], m, uv[0], uv[1], uv[2], uv[3]); }
function quad(a, P0, P1, P2, P3, n, col, m, su, sv) {
  const P = [P0, P1, P2, P3], U = [[0, 0], [su, 0], [su, sv], [0, sv]];
  for (const i of [0, 1, 2, 0, 2, 3]) pushV(a, P[i], n, col, m, [U[i][0], U[i][1], su, sv]);
}
function obox(a, cx, cy, yaw, x0, y0, z0, x1, y1, z1, col, m, topM = m) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const T = (x, y, z) => [cx + x * c - y * s, cy + x * s + y * c, z];
  const R = (x, y, z) => [x * c - y * s, x * s + y * c, z];
  const lx = x1 - x0, ly = y1 - y0, lz = z1 - z0;
  quad(a, T(x0, y0, z1), T(x1, y0, z1), T(x1, y1, z1), T(x0, y1, z1), R(0, 0, 1), col, topM, lx, ly);
  quad(a, T(x1, y0, z0), T(x1, y1, z0), T(x1, y1, z1), T(x1, y0, z1), R(1, 0, 0), col, m, ly, lz);
  quad(a, T(x0, y1, z0), T(x0, y0, z0), T(x0, y0, z1), T(x0, y1, z1), R(-1, 0, 0), col, m, ly, lz);
  quad(a, T(x0, y0, z0), T(x1, y0, z0), T(x1, y0, z1), T(x0, y0, z1), R(0, -1, 0), col, m, lx, lz);
  quad(a, T(x1, y1, z0), T(x0, y1, z0), T(x0, y1, z1), T(x1, y1, z1), R(0, 1, 0), col, m, lx, lz);
}
function prism(a, cx, cy, r, z0, z1, n, col, m, topM = m) {
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2, am = (a0 + a1) / 2;
    const p0 = [cx + Math.cos(a0) * r, cy + Math.sin(a0) * r], p1 = [cx + Math.cos(a1) * r, cy + Math.sin(a1) * r];
    const w = 2 * r * Math.sin(Math.PI / n);
    quad(a, [p0[0], p0[1], z0], [p1[0], p1[1], z0], [p1[0], p1[1], z1], [p0[0], p0[1], z1], [Math.cos(am), Math.sin(am), 0], col, m, w, z1 - z0);
    const tri = [[cx, cy], p0, p1];
    for (const q of tri) pushV(a, [q[0], q[1], z1], [0, 0, 1], col, topM, [q[0] - cx + r, q[1] - cy + r, 2 * r, 2 * r]);
  }
}
const solid = (x0, y0, x1, y1, z0, z1, col, m, topM, occ = true) => { obox(SV, 0, 0, 0, x0, y0, z0, x1, y1, z1, col, m, topM); if (occ) occluders.push({ x0, y0, x1, y1, h: z1 }); };

const C = {
  wall: lin('#8f8b82'), door: lin('#4b5a52'), upright: lin('#2a4c86'), beam: lin('#c9661d'), deck: lin('#77736b'),
  box1: lin('#a77d4a'), box2: lin('#b8915c'), box3: lin('#94703f'), crate: lin('#9a7246'), pallet: lin('#8a6a45'),
  barrelB: lin('#24496f'), barrelR: lin('#7a2a22'), bomb: lin('#2a2d2f'), led: [1, 0.08, 0.04],
};
const WALL_H = 2.2;
// nave (sitio A): 5..23 x 1..12; pasillo al oeste 0..5 x 4.6..7.4; puerta en x=5, y 5.4..6.6
solid(4.85, 0.85, 23.15, 1.15, 0, WALL_H, C.wall, 3, 4);
solid(4.85, 11.85, 23.15, 12.15, 0, WALL_H, C.wall, 3, 4);
solid(22.85, 0.85, 23.15, 12.15, 0, WALL_H, C.wall, 3, 4);
solid(4.85, 0.85, 5.15, 5.4, 0, WALL_H, C.wall, 3, 4);
solid(4.85, 6.6, 5.15, 12.15, 0, WALL_H, C.wall, 3, 4);
solid(0, 4.3, 4.85, 4.6, 0, WALL_H, C.wall, 3, 4);
solid(0, 7.4, 4.85, 7.7, 0, WALL_H, C.wall, 3, 4);
solid(5.15, 5.36, 6.35, 5.43, 0, 1.95, C.door, 9); // puerta abierta contra la pared
// estanterías (racks) con cajas arriba
function rack(x0, y0, x1, y1) {
  const vertical = (y1 - y0) > (x1 - x0);
  const len = vertical ? y1 - y0 : x1 - x0;
  const nb = Math.round(len / 2.5);
  for (let i = 0; i <= nb; i++) {
    const t = i / nb;
    for (const side of [0, 1]) {
      const px = vertical ? (side ? x1 - 0.08 : x0) : x0 + t * (len - 0.08);
      const py = vertical ? y0 + t * (len - 0.08) : (side ? y1 - 0.08 : y0);
      solid(px, py, px + 0.08, py + 0.08, 0, 2.05, C.upright, 0, 0, false);
    }
  }
  solid(x0, y0, x1, y0 + 0.07, 1.9, 2.0, C.beam, 0, 0, false);
  solid(x0, y1 - 0.07, x1, y1, 1.9, 2.0, C.beam, 0, 0, false);
  solid(x0 + 0.04, y0 + 0.07, x1 - 0.04, y1 - 0.07, 1.96, 1.99, C.deck, 0, 0, false);
  occluders.push({ x0, y0, x1, y1, h: 2.0 });
  // cajas (determinista)
  let seed = Math.floor(x0 * 13 + y0 * 7);
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const L = vertical ? y1 - y0 : x1 - x0, W = vertical ? x1 - x0 : y1 - y0;
  let u = 0.1;
  while (u < L - 0.5) {
    const bl = 0.45 + rnd() * 0.5, bw = Math.min(W - 0.16, 0.5 + rnd() * 0.4), bh = 0.25 + rnd() * 0.35;
    if (u + bl > L - 0.08) break;
    const off = 0.08 + rnd() * (W - 0.16 - bw);
    const col = [C.box1, C.box2, C.box3][Math.floor(rnd() * 3)];
    if (rnd() > 0.18) {
      if (vertical) solid(x0 + off, y0 + u, x0 + off + bw, y0 + u + bl, 2.0, 2.0 + bh, col, 2, 2, false);
      else solid(x0 + u, y0 + off, x0 + u + bl, y0 + off + bw, 2.0, 2.0 + bh, col, 2, 2, false);
      occluders.push(vertical ? { x0: x0 + off, y0: y0 + u, x1: x0 + off + bw, y1: y0 + u + bl, h: 2.0 + bh } : { x0: x0 + u, y0: y0 + off, x1: x0 + u + bl, y1: y0 + off + bw, h: 2.0 + bh });
    }
    u += bl + 0.06 + rnd() * 0.2;
  }
}
rack(7, 1.3, 12.2, 2.3);
rack(14, 1.3, 19.2, 2.3);
rack(21.7, 3.4, 22.7, 9.0);
// cajas de madera (cobertura del defensor)
solid(10.4, 7.0, 11.5, 8.1, 0, 1.1, C.crate, 1);
solid(11.55, 7.05, 12.6, 8.1, 0, 1.05, C.crate, 1);
solid(10.4, 8.15, 11.5, 9.25, 0, 1.1, C.crate, 1);
solid(10.45, 8.2, 11.45, 9.2, 1.1, 2.15, C.crate, 1);
// palé con cajas
solid(16.4, 8.5, 18.0, 9.9, 0, 0.14, C.pallet, 1);
solid(16.5, 8.6, 17.9, 9.8, 0.14, 1.05, C.box2, 2);
solid(14.0, 10.25, 15.2, 11.3, 0, 0.14, C.pallet, 1);
// barriles
for (const [x, y, c] of [[20.2, 10.6, C.barrelB], [20.85, 11.15, C.barrelB], [19.6, 11.25, C.barrelR], [21.4, 10.5, C.barrelB]]) {
  prism(SV, x, y, 0.29, 0, 0.9, 14, c, 11);
  occluders.push({ cx: x, cy: y, r: 0.29, h: 0.9 });
}
// bomba en el sitio A
solid(15.45, 4.45, 15.95, 4.78, 0, 0.17, C.bomb, 7, 7, false);
solid(15.85, 4.55, 15.91, 4.61, 0.17, 0.2, C.led, 10, 10, false);

// heightmap de oclusores
const HW = MAP.w * HPPM, HH = MAP.h * HPPM;
const heights = new Float32Array(HW * HH);
for (const o of occluders) {
  if (o.r) {
    for (let y = Math.floor((o.cy - o.r) * HPPM); y <= Math.ceil((o.cy + o.r) * HPPM); y++)
      for (let x = Math.floor((o.cx - o.r) * HPPM); x <= Math.ceil((o.cx + o.r) * HPPM); x++) {
        const dx = (x + 0.5) / HPPM - o.cx, dy = (y + 0.5) / HPPM - o.cy;
        if (dx * dx + dy * dy <= o.r * o.r && x >= 0 && y >= 0 && x < HW && y < HH) heights[y * HW + x] = Math.max(heights[y * HW + x], o.h);
      }
    continue;
  }
  const xa = Math.max(0, Math.round(o.x0 * HPPM)), xb = Math.min(HW, Math.round(o.x1 * HPPM));
  const ya = Math.max(0, Math.round(o.y0 * HPPM)), yb = Math.min(HH, Math.round(o.y1 * HPPM));
  for (let y = ya; y < yb; y++) for (let x = xa; x < xb; x++) heights[y * HW + x] = Math.max(heights[y * HW + x], o.h);
}
const tallBoxes = occluders.filter((o) => !o.r && o.h > 1.5);
function losClear(ax, ay, bx, by) {
  for (const o of tallBoxes) {
    let t0 = 0, t1 = 1, ok = true;
    for (const [p, d, lo, hi] of [[ax, bx - ax, o.x0, o.x1], [ay, by - ay, o.y0, o.y1]]) {
      if (Math.abs(d) < 1e-9) { if (p < lo || p > hi) { ok = false; break; } continue; }
      let ta = (lo - p) / d, tb = (hi - p) / d;
      if (ta > tb) [ta, tb] = [tb, ta];
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
      if (t0 > t1) { ok = false; break; }
    }
    if (ok) return false;
  }
  return true;
}

// ------------------------------------------------------------ GL helpers
function shader(type, src, name) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const log = gl.getShaderInfoLog(s); console.error(name, log); throw new Error(name + ': ' + log); }
  return s;
}
function program(vs, fs, name) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs, name + '.vs'));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs, name + '.fs'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ': ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); const key = info.name.replace(/\[0\]$/, ''); u[key] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
function tex(w, h, internal, format, type, filter, data = null) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fbo(textures, depth = null) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  textures.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  if (depth) gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
  gl.drawBuffers(textures.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('fbo ' + st);
  return f;
}

// ------------------------------------------------------------ GLSL
const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\n';
const NOISE = `
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);
 return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+17.1;a*=0.5;}return s;}
`;
const FS_TRI_VS = HEAD + `out vec2 vUv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;

// Sombra suave 2.5D: marcha sobre el heightmap desde el punto del mapa hacia la luz,
// solo en la franja de altura donde hay oclusores (z < 2.75 m). Ruido de gradiente
// entrelazado (estable, sin manchas) para repartir los pasos.
const MARCH = `
uniform sampler2D uHeight; uniform vec2 uMap; uniform int uSteps;
float H(vec2 p){return texture(uHeight,p/uMap).r;}
float ign(vec2 p){return fract(52.9829189*fract(dot(p,vec2(0.06711056,0.00583715))));}
float march(vec3 P, vec3 L, float k, float j){
  vec3 d=L-P; float dist=length(d.xy); float dl=length(d);
  if(dist<0.05) return 1.0;
  float t0=min(0.1/dist,0.9);
  float tmax=d.z>0.01?clamp((2.75-P.z)/d.z,t0+0.02,1.0):1.0;
  float vis=1.0;
  for(int i=0;i<96;i++){
    if(i>=uSteps) break;
    float t=t0+(tmax-t0)*(float(i)+j)/float(uSteps);
    vec3 q=P+d*t;
    float rd=max(t*dl,0.05);
    vis=min(vis,k*(q.z-H(q.xy))/rd);
    if(vis<=0.0) return 0.0;
  }
  return smoothstep(0.0,1.0,clamp(vis,0.0,1.0));
}`;
// Luces fijas (lámparas): se hornean una vez por mapa a alta resolución.
const BAKE_LIGHT_FS = HEAD + MARCH + `
in vec2 vUv; uniform vec4 uLP[4]; uniform float uLK[4]; out vec4 o;
void main(){
  vec2 p=vUv*uMap; vec3 P=vec3(p,H(p)+0.02); vec4 r=vec4(1.0);
  float j=ign(gl_FragCoord.xy);
  for(int i=0;i<4;i++) r[i]=march(P,uLP[i].xyz,uLK[i],fract(j+float(i)*0.618));
  o=r;
}`;
// Luces dinámicas por cuadro (3 linternas = también la línea de vista de cada operador, + fogonazo/bomba).
const DYN_FS = HEAD + MARCH + `
in vec2 vUv; uniform vec4 uLP[4]; uniform float uLK[4]; uniform int uLN; out vec4 o;
void main(){
  vec2 p=vUv*uMap; vec3 P=vec3(p,H(p)+0.02); vec4 r=vec4(1.0);
  float j=ign(gl_FragCoord.xy);
  for(int i=0;i<4;i++){ if(i>=uLN) break; r[i]=march(P,uLP[i].xyz,uLK[i],fract(j+float(i)*0.618)); }
  o=r;
}`;
// Suavizado 3x3 (tienda) para borrar el patrón de los pasos.
const SOFT_FS = HEAD + `in vec2 vUv; uniform sampler2D uSrc; uniform vec2 uT; out vec4 o;
void main(){vec4 c=texture(uSrc,vUv)*0.25;
 c+=(texture(uSrc,vUv+vec2(uT.x,0))+texture(uSrc,vUv-vec2(uT.x,0))+texture(uSrc,vUv+vec2(0,uT.y))+texture(uSrc,vUv-vec2(0,uT.y)))*0.125;
 c+=(texture(uSrc,vUv+uT)+texture(uSrc,vUv-uT)+texture(uSrc,vUv+vec2(uT.x,-uT.y))+texture(uSrc,vUv-vec2(uT.x,-uT.y)))*0.0625;
 o=c;}`;

// Horneado del suelo: albedo + rugosidad, normal + AO (una vez por mapa).
const BAKE_FS = HEAD + NOISE + `
in vec2 vUv;
uniform sampler2D uHeight; uniform sampler2D uPaint; uniform vec2 uMap;
layout(location=0) out vec4 oA; layout(location=1) out vec4 oN;
bool inHall(vec2 p){return p.x>5.0&&p.x<23.0&&p.y>1.0&&p.y<12.0;}
bool inCorr(vec2 p){return p.x>=0.0&&p.x<=5.2&&p.y>4.45&&p.y<7.55;}
float hConcrete(vec2 p){
  float h=fbm(p*3.0)*0.4+vnoise(p*22.0)*0.15+vnoise(p*70.0)*0.05;
  vec2 f=abs(fract(p/4.0+0.5)-0.5)*4.0; float j=min(f.x,f.y);
  h-=(1.0-smoothstep(0.004,0.013,j));
  float cr=abs(fbm(p*0.7+11.0)-0.5);

vec4 bicubic(sampler2D t, vec2 uv, vec2 size){

// - mide el tiempo de GPU real (EXT_disjoint_timer_query_webgl2) cuando existe; el intervalo entre
//   cuadros no sirve en pantallas limitadas a 30 Hz (modo bajo consumo, visor embebido): ahí todo cuadro
//   "tarda" 33 ms aunque la GPU use 5, y la versión anterior bajaba la resolución sin motivo.
// - si no hay temporizador, detecta la cadencia de la pantalla (el mínimo de los intervalos) y solo
//   baja cuando los cuadros llegan tarde respecto a esa cadencia, no respecto a 60 Hz.

  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const pw = Math.max(1, Math.round(cw * scale)), ph = Math.max(1, Math.round(ch * scale));
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  if (!RT || RT.w !== pw || RT.h !== ph) makeTargets(pw, ph);

  // cámara cenital, encuadre de la nave + pasillo
  const asp = pw / ph, fov = 38 * Math.PI / 180, tn = Math.tan(fov / 2);
  const cx = 11.9, cy = 6.5;
  const H = Math.max(6.3 / tn, 12.3 / (tn * asp));
  const eye = [cx, cy + 0.0001, H];
  const VP = mul(persp(fov, asp, 0.5, H + 5), lookAt(eye, [cx, cy, 0], [0, -1, 0]));

  // luces
  const flick = 0.72 + 0.28 * (Math.sin(t * 31) > -0.85 ? 1 : 0.1) * (0.9 + 0.1 * Math.sin(t * 120));
  setLight(0, 9.0, 4.6, 5.2, 15, [1.0, 0.9, 0.78], 34, 3.2, -1);
  setLight(1, 16.4, 7.6, 5.2, 15, [1.0, 0.68, 0.38], 50, 3.2, -1);
  setLight(2, 20.6, 3.6, 5.2, 14, [0.78, 0.9, 1.0], 40 * flick, 3.2, -1);
  setLight(3, 2.4, 6.0, 2.6, 6, [1.0, 0.78, 0.55], 7, 7, -1);
  let n = 4;
  for (let i = 0; i < 3; i++) { const c = chars[i]; const m = muzzle(c); setLight(n++, m[0], m[1], m[2], 15, [0.92, 0.96, 1.0], 34, 9, i, [c.yaw, 26 * Math.PI / 180, 11 * Math.PI / 180]); }
  if (flash) { const m = muzzle(chars[flash.si]); setLight(n++, m[0], m[1], m[2], 9, [1.0, 0.72, 0.38], 130 * (1 - flash.f / 0.42), 16, flash.si); }
  else setLight(n++, 15.88, 4.58, 0.3, 2, [1, 0.1, 0.05], (Math.floor(t * 1.5 * 2) % 2 === 0 ? 0 : 1.2), 8, -1);
  const NL = n;
  const dVis = enemyVisible(chars[3]);
  for (let i = 0; i < 4; i++) { const c = chars[i]; CH.set([c.x, c.y, c.dead ? 0.3 : 1.75, 0.24], i * 4); }
  for (let i = 0; i < 3; i++) { const c = chars[i]; EYE.set([c.x, c.y, c.yaw, 1], i * 4); }

  // 1) luces dinámicas (linternas = visión, fogonazo/bomba) en espacio de mapa, a dynPpm
  const L4 = LP.subarray(16, 32), K4 = LK.subarray(4, 8);
  { // también en "antes": la niebla de guerra sale de esta pasada
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, DYN.rawF); gl.viewport(0, 0, DYN.w, DYN.h);
    gl.useProgram(P.dyn.p); const du = P.dyn.u;
    bindTex(P.dyn, 'uHeight', heightTex, 0);
    gl.uniform2f(du.uMap, MAP.w, MAP.h); gl.uniform4fv(du.uLP, L4); gl.uniform1fv(du.uLK, K4); gl.uniform1i(du.uLN, NL - 4); gl.uniform1i(du.uSteps, quality.steps);
    gl.bindVertexArray(emptyVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, DYN.f); gl.useProgram(P.soft.p);
    bindTex(P.soft, 'uSrc', DYN.raw, 0); gl.uniform2f(P.soft.u.uT, 1 / DYN.w, 1 / DYN.h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // 2) escena HDR
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.sceneF); gl.viewport(0, 0, pw, ph);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
  const common = (prog) => {
    const u = prog.u;
    gl.uniformMatrix4fv(u.uVP, false, VP);
    gl.uniform4fv(u.uLP, LP); gl.uniform4fv(u.uLD, LD); gl.uniform4fv(u.uLC, LC); gl.uniform1i(u.uLN, NL);
    bindTex(prog, 'uStat', statTex, 0); bindTex(prog, 'uDyn', DYN.tex, 1); bindTex(prog, 'uHeight', heightTex, 3);
    gl.uniform2f(u.uStatSize, SW, SH); gl.uniform2f(u.uDynSize, DYN.w, DYN.h);
    gl.uniform1iv(u.uLO, LO); gl.uniform1fv(u.uLK, LK); gl.uniform4fv(u.uCh, CH); gl.uniform1i(u.uChN, dVis ? 4 : 3); gl.uniform4fv(u.uEye, EYE);
    gl.uniform2f(u.uMap, MAP.w, MAP.h); gl.uniform3fv(u.uCam, eye);
    gl.uniform3f(u.uAmbTop, 0.045, 0.05, 0.062); gl.uniform3f(u.uAmbBot, 0.016, 0.014, 0.012);
    gl.uniform4f(u.uTog, tog.shadows, tog.normals, tog.fog, before ? 1 : 0);
    gl.uniform1f(u.uOut, OUT_SCALE); gl.uniform1f(u.uTime, t);
  };
  gl.useProgram(P.floor.p); common(P.floor);
  bindTex(P.floor, 'uAlb', albTex, 4); bindTex(P.floor, 'uNrm', nrmTex, 5);
  gl.bindVertexArray(floorVao); gl.drawArrays(gl.TRIANGLES, 0, 6);

  // overlay de suelo (anillos, ruta, sangre): sin luz ni niebla, valores pensados para quedar legibles tras el tonemap
  const G = [];
  const tri = (a, b, c, col) => { for (const p of [a, b, c]) G.push(p[0], p[1], p[2], col[0], col[1], col[2], col[3]); };
  const ring = (x, y, r0, r1, col, z = 0.02) => { const N = 32; for (let i = 0; i < N; i++) { const a0 = i / N * 6.2832, a1 = (i + 1) / N * 6.2832; const p = (r, a) => [x + Math.cos(a) * r, y + Math.sin(a) * r, z]; tri(p(r0, a0), p(r1, a0), p(r1, a1), col); tri(p(r0, a0), p(r1, a1), p(r0, a1), col); } };
  const disc = (x, y, r, col, z) => { const N = 24; for (let i = 0; i < N; i++) { const a0 = i / N * 6.2832, a1 = (i + 1) / N * 6.2832; tri([x, y, z], [x + Math.cos(a0) * r, y + Math.sin(a0) * r, z], [x + Math.cos(a1) * r, y + Math.sin(a1) * r, z], col); } };
  const seg = (a, b, w, col, z = 0.022) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l * w, ny = dx / l * w; tri([a[0] + nx, a[1] + ny, z], [b[0] + nx, b[1] + ny, z], [b[0] - nx, b[1] - ny, z], col); tri([a[0] + nx, a[1] + ny, z], [b[0] - nx, b[1] - ny, z], [a[0] - nx, a[1] - ny, z], col); };
  const d = chars[3];
  if (d.dead) disc(d.x - Math.cos(d.yaw) * 0.3, d.y - Math.sin(d.yaw) * 0.3, 0.12 + 0.36 * Math.min(1, d.deadT / 1.5), [0.045, 0.0, 0.0, 0.8], 0.012);
  const teamCol = [0.06, 0.62, 0.95, 0.9];
  for (let i = 0; i < 3; i++) ring(chars[i].x, chars[i].y, 0.31, 0.355, teamCol);
  if (dVis && !d.dead) ring(d.x, d.y, 0.31, 0.355, [0.95, 0.12, 0.08, 0.95]);
  { // ruta pendiente de ZORRO (dashes)
    const c = chars[1], s0 = Math.max(0, (t - c.start) * SPEED);
    for (let s = s0 + 0.45; s < c.len; s += 0.7) { const a = pathAt(c, s), b = pathAt(c, Math.min(c.len, s + 0.38)); seg(a, b, 0.035, [0.85, 0.92, 1.0, 0.75]); }
  }
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  gl.useProgram(P.fx.p); gl.uniformMatrix4fv(P.fx.u.uVP, false, VP); gl.uniform1f(P.fx.u.uOut, OUT_SCALE);
  gl.bindVertexArray(fxGround.vao); gl.bindBuffer(gl.ARRAY_BUFFER, fxGround.buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(G), gl.STREAM_DRAW);
  gl.drawArrays(gl.TRIANGLES, 0, G.length / 7);
  gl.disable(gl.BLEND); gl.depthMask(true);

  // mallas
  gl.useProgram(P.mesh.p); common(P.mesh); bindTex(P.mesh, 'uNrm', nrmTex, 5);
  gl.bindVertexArray(staticMesh.vao); gl.drawArrays(gl.TRIANGLES, 0, staticMesh.count);
  const DV = [];
  for (let i = 0; i < 4; i++) if (i < 3 || dVis) buildChar(DV, chars[i]);
  gl.bindVertexArray(dynMesh.vao); gl.bindBuffer(gl.ARRAY_BUFFER, dynMesh.buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(DV), gl.STREAM_DRAW);
  gl.drawArrays(gl.TRIANGLES, 0, DV.length / 14);

  // efectos aditivos: trazadoras y fogonazo (HDR: alimentan el bloom)
  G.length = 0;
  if (flash && (flash.si < 3 || dVis)) {
    const s = chars[flash.si], tg = chars[flash.ti], m = muzzle(s);
    const j = Math.sin(flash.n * 12.9898) * 0.18;
    const end = [tg.x + j, tg.y - j, 1.1];
    const dx = end[0] - m[0], dy = end[1] - m[1], l = Math.hypot(dx, dy), nx = -dy / l * 0.025, ny = dx / l * 0.025;
    const a0 = Math.max(0, flash.f / 0.42 - 0.2), b0 = Math.min(1, a0 + 0.45);
    const A = [m[0] + dx * a0, m[1] + dy * a0, 1.25], B = [m[0] + dx * b0, m[1] + dy * b0, 1.2];
    const tc = [9, 6.5, 3.2, 1];
    tri([A[0] + nx, A[1] + ny, A[2]], [B[0] + nx, B[1] + ny, B[2]], [B[0] - nx, B[1] - ny, B[2]], tc);
    tri([A[0] + nx, A[1] + ny, A[2]], [B[0] - nx, B[1] - ny, B[2]], [A[0] - nx, A[1] - ny, A[2]], tc);
    const fk = 1 - flash.f / 0.42, fl = [14 * fk, 9 * fk, 4 * fk, 1];
    for (let k = 0; k < 6; k++) { const a = s.yaw + (k - 2.5) * 0.35, r = (k % 2 ? 0.22 : 0.42) * (0.7 + 0.3 * fk); tri([m[0], m[1], 1.32], [m[0] + Math.cos(a - 0.15) * r * 0.4, m[1] + Math.sin(a - 0.15) * r * 0.4, 1.32], [m[0] + Math.cos(a) * r, m[1] + Math.sin(a) * r, 1.32], fl); }
  }
  if (G.length) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false);
    gl.useProgram(P.fx.p);
    gl.bindVertexArray(fxAdd.vao); gl.bindBuffer(gl.ARRAY_BUFFER, fxAdd.buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(G), gl.STREAM_DRAW);
    gl.drawArrays(gl.TRIANGLES, 0, G.length / 7);
    gl.disable(gl.BLEND); gl.depthMask(true);
  }
  gl.disable(gl.DEPTH_TEST);

  // 3) bloom a 1/4
  gl.bindVertexArray(emptyVao);
  const bloomOn = tog.bloom && quality.bloom && !before;
  if (bloomOn) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.b0F); gl.viewport(0, 0, RT.qw, RT.qh);
    gl.useProgram(P.bright.p); bindTex(P.bright, 'uSrc', RT.scene, 0);
    gl.uniform2f(P.bright.u.uTexel, 1 / pw, 1 / ph); gl.uniform1f(P.bright.u.uIn, 1 / OUT_SCALE); gl.uniform1f(P.bright.u.uThr, 0.9);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.useProgram(P.blur.p);
    for (let k = 0; k < 2; k++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, RT.b1F); bindTex(P.blur, 'uSrc', RT.b0, 0); gl.uniform2f(P.blur.u.uDir, (1 + k) / RT.qw, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, RT.b0F); bindTex(P.blur, 'uSrc', RT.b1, 0); gl.uniform2f(P.blur.u.uDir, 0, (1 + k) / RT.qh); gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
  }
  // 4) final
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, pw, ph);
  gl.useProgram(P.final.p); const fu = P.final.u;
  bindTex(P.final, 'uScene', RT.scene, 0); bindTex(P.final, 'uBloom', RT.b0, 1);
  gl.uniform1f(fu.uIn, 1 / OUT_SCALE); gl.uniform1f(fu.uExp, 1.0); gl.uniform1f(fu.uBloomS, bloomOn ? 0.55 : 0);
  gl.uniform1f(fu.uGrain, tog.grain ? 0.035 : 0); gl.uniform1f(fu.uTime, now / 1000); gl.uniform1f(fu.uBefore, before ? 1 : 0);
  gl.uniform2f(fu.uRes, pw, ph);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (query) { gl.endQuery(timerExt.TIME_ELAPSED_EXT); queries.push(query); }

  const hz = Math.round(1000 / perf.cadence);
  stats.textContent = `${fps.toFixed(0)} fps · ${perf.ms.toFixed(1)} ms` + (perf.gpuMs >= 0 ? ` · GPU ${perf.gpuMs.toFixed(1)} ms` : '') +
    `\npantalla ${hz} Hz` + (hz < 50 ? ' (limitada)' : '') + ` · calidad ${qName}` +
    `\nescena ${scale.toFixed(2)}x · ${pw}×${ph}` +
    `\nluz fija ${SPPM} px/m · ${SW}×${SH} (horneada)` +
    `\nluz dinámica ${DYN.ppm} px/m · ${DYN.w}×${DYN.h} · ${quality.steps} pasos` +
    `\nbloom ${bloomOn ? RT.qw + '×' + RT.qh : 'apagado'} · ${HDR ? 'HDR 16F' : 'LDR'}`;
  stats.style.whiteSpace = 'pre';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
