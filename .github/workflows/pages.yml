# Publica el juego en GitHub Pages en cada push a main (o a mano desde Actions).
# Sirve los archivos tal cual (index.html + src/, módulos ES sin empaquetar),
# después de que pasan las pruebas.
#
# Antes despliega el servidor del multijugador (server/, Cloudflare Workers) si están los
# secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID, y escribe su dirección en
# src/config/server.js del sitio publicado. Si faltan los secretos o el despliegue falla,
# el juego se publica igual y el menú muestra el multijugador como no disponible.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Desplegar servidor
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        working-directory: server
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Servidor: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Probar el servidor
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        run: curl -fsS "${{ steps.deploy.outputs.url }}/"

  deploy:
    needs: server
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Arma el sitio
        env:
          SERVER_URL: ${{ needs.server.outputs.url }}
        run: |
          mkdir _site
          cp -r index.html src _site/
          if [ -n "$SERVER_URL" ]; then
            echo "export const SERVER_URL = '$SERVER_URL';" > _site/src/config/server.js
          fi
          cat _site/src/config/server.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
